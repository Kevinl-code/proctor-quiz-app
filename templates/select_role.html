<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Login</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="icon" href="{{ url_for('static', filename='images/favicon.png') }}" sizes="32x32">
<link rel="icon" href="{{ url_for('static', filename='images/favicon.png') }}" sizes="192x192">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='images/favicon.png') }}">
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
    
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}">

 
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/logo.png') }}">
    <link rel="apple-touch-icon" sizes="152x152" href="{{ url_for('static', filename='images/logo.png') }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='images/logo.png') }}">
    <link rel="apple-touch-icon" sizes="167x167" href="{{ url_for('static', filename='images/logo.png') }}">

    <!-- Android / Chrome Manifest -->
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <style>
        .role-options{
    display:flex;
    gap:15px;
    justify-content:center;
    margin:20px 0;
}

.role-card{
    position:relative;
    width:150px;
    padding:15px;
    border:2px solid #ddd;
    border-radius:12px;
    cursor:pointer;
    text-align:center;
    transition:.3s;
}

.role-card input{
    display:none;
}

.role-card span{
    font-weight:600;
}

.role-card.professor{
    border-color:#3b82f6;
}

.role-card.student{
    border-color:#10b981;
}

.role-card input:checked + span{
    color:white;
}

.role-card.professor:has(input:checked){
    background:#3b82f6;
    color:white;
}

.role-card.student:has(input:checked){
    background:#10b981;
    color:white;
}
    </style>
    </head>
    
</head>
<body>
    <div id="splash">

    <div class="logo-container">

        <div class="spinner"></div>

        <div class="logo-circle">
            <img src="/static/images/logo.png" class="main-logo">
        </div>

    </div>
</div>
       <div class="auth-container">
    <img src="/static/images/logo.png" class="page-logo">

    <div class="card">
       
<form action="/save-role" method="POST">

    <h2>Select Your Role</h2>

    <div class="role-options">

        <label class="role-card professor">
            <input type="radio" name="role" value="professor" required>
            <span>Professor</span>
        </label>

        <label class="role-card student">
            <input type="radio" name="role" value="student" required>
            <span>Student</span>
        </label>

    </div>

    <button class="btn-primary" type="submit">
        Continue
    </button>

</form>  
    </div>
</div>
</body>
</html>
