<form action="/save-role" method="POST">

    <h2>Select Your Role</h2>

    <label>
        <input type="radio"
               name="role"
               value="professor"
               required>
        Professor
    </label>

    <label>
        <input type="radio"
               name="role"
               value="student"
               required>
        Student
    </label>

    <button type="submit">
        Continue
    </button>

</form>
