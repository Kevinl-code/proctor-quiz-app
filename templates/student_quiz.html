<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Quiz</title>

<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<script src="{{ url_for('static', filename='js/quiz.js') }}" defer></script>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</head>

<body>
<div style="position:absolute; top:20px; right:20px;">
   <button href="/logout" class="btn-primary">Logout
</button>
</div>
<div class="auth-container">

<img src="/static/images/logo.png" class="page-logo">

<div class="card wide">

<!-- HEADER -->
<div style="display:flex; justify-content:space-between; align-items:center">

<h2 id="quizTitle">Quiz</h2>

<div id="timer" style="font-weight:800; color:#22c55e">
00:00
</div>

</div>

<div class="sub">Answer all questions carefully</div>

<!-- QUESTION -->
<div id="questionBox" style="margin-top:20px">

<h3 id="questionText"></h3>

<div id="optionsBox" style="margin-top:15px"></div>

</div>

<!-- NAVIGATION -->
<div style="display:flex; justify-content:space-between; margin-top:20px">

<button id="prevBtn" class="btn-secondary" onclick="prevQuestion()">⬅ Previous</button>

<button id="nextBtn" class="btn-primary" onclick="nextQuestion()">Next ➡</button>

<button id="submitBtn" class="btn-primary" style="display:none" onclick="confirmSubmit()">Submit</button>

</div>

</div>

</div>
<script>
    let isProcessingViolation = false;

    // Dynamically extract the quiz_id from the browser URL path automatically
    const pathSegments = window.location.pathname.split('/');
    const currentQuizId = pathSegments[pathSegments.length - 1]; 

    function triggerViolation(violationType) {
        if (isProcessingViolation) return;
        isProcessingViolation = true;

        console.log(`Sending violation: ${violationType} for Quiz: ${currentQuizId}`);

        fetch('/log_violation', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                quiz_id: currentQuizId,
                violation_type: violationType
            })
        })
        .then(response => response.json())
        .then(data => {
            if (data.disqualified) {
                alert("🚨 YOU HAVE BEEN AUTOMATICALLY DISQUALIFIED! 🚨\n\nYour limit of 2 allowed violations has been breached. Your professor has been alerted.");
                window.location.href = "/student"; 
            } else {
                alert(`⚠️ PROCTOR WARNING!\n\nViolation detected: ${violationType}\nStatus: ${data.message}`);
            }
            
            // 3-second cooldown to avoid button/tab spamming
            setTimeout(() => { isProcessingViolation = false; }, 3000);
        })
        .catch(error => {
            console.error("Error logging violation:", error);
            isProcessingViolation = false;
        });
    }

    // Detect Tab Switches / Minimizing
    document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
            triggerViolation('tab_switch');
        }
    });

    // Detect App Switches / Clicking Outside Browser Window
    window.addEventListener("blur", () => {
        triggerViolation('app_switch');
    });
</script>
</body>
</html>
