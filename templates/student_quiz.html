<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Quiz</title>

<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<script src="{{ url_for('static', filename='js/quiz.js') }}" defer></script>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</head>

<body>
<div style="position:absolute; top:20px; right:20px;">
   <button href="/logout" class="btn-primary">Logout
</button>
</div>
<div class="auth-container">

<img src="/static/images/logo.png" class="page-logo">

<div class="card wide">

<!-- HEADER -->
<div style="display:flex; justify-content:space-between; align-items:center">

<h2 id="quizTitle">Quiz</h2>

<div id="timer" style="font-weight:800; color:#22c55e">
00:00
</div>

</div>

<div class="sub">Answer all questions carefully</div>

<!-- QUESTION -->
<div id="questionBox" style="margin-top:20px">

<h3 id="questionText"></h3>

<div id="optionsBox" style="margin-top:15px"></div>

</div>

<!-- NAVIGATION -->
<div style="display:flex; justify-content:space-between; margin-top:20px">

<button id="prevBtn" class="btn-secondary" onclick="prevQuestion()">⬅ Previous</button>

<button id="nextBtn" class="btn-primary" onclick="nextQuestion()">Next ➡</button>

<button id="submitBtn" class="btn-primary" style="display:none" onclick="confirmSubmit()">Submit</button>

</div>

</div>

</div>
<script>
    // A flag to prevent spamming the backend if multiple events fire at once
    let isProcessingViolation = false;

    // The quiz_id needs to be passed from your template. 
    // Assuming you have it as a JavaScript variable or hidden input.
    // Replace 'YOUR_QUIZ_ID_VARIABLE' with how you access the quiz ID in JS.
    const currentQuizId = "YOUR_QUIZ_ID_VARIABLE"; 

    function triggerViolation(violationType) {
        if (isProcessingViolation) return;
        isProcessingViolation = true;

        fetch('/log_violation', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                quiz_id: currentQuizId,
                violation_type: violationType
            })
        })
        .then(response => response.json())
        .then(data => {
            if (data.disqualified) {
                // Show disqualification popup and kick the user out
                alert("🚨 YOU HAVE BEEN DISQUALIFIED! 🚨\n\nYour professor has been notified via email.");
                window.location.href = "/student"; // Redirect to dashboard
            } else {
                // Show warning popup to the user
                alert("⚠️ WARNING! " + violationType + " detected.\n\n" + data.message);
            }
            
            // Allow new violations to be logged after a 3-second cooldown
            setTimeout(() => { isProcessingViolation = false; }, 3000);
        })
        .catch(error => {
            console.error("Error logging violation:", error);
            isProcessingViolation = false;
        });
    }

    // EVENT 1: Detect Tab Switch or Minimizing the Browser
    document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
            triggerViolation('tab_switch');
        }
    });

    // EVENT 2: Detect clicking outside the browser window (e.g., opening another app)
    window.addEventListener("blur", () => {
        triggerViolation('app_switch');
    });
</script>
</body>
</html>
